<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Простая браузерная игра «Угадай число»."
    />
    <title>Угадай число</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <p class="eyebrow">Мини-игра</p>
      <h1 id="game-title">Угадай число</h1>
      <p class="intro">Компьютер загадал целое число от <strong>1</strong> до <strong>100</strong>.</p>

      <form id="guess-form" class="guess-form" novalidate>
        <label for="guess-input">Ваш вариант</label>
        <div class="input-row">
          <input
            id="guess-input"
            name="guess"
            type="number"
            inputmode="numeric"
            min="1"
            max="100"
            step="1"
            placeholder="Например, 42"
            autocomplete="off"
            required
          />
          <button type="submit">Проверить</button>
        </div>
      </form>

      <p id="message" class="message" role="status" aria-live="polite">
        Введите число и сделайте первую попытку.
      </p>
      <p class="attempts">Попыток: <strong id="attempts-count">0</strong></p>

      <button id="restart-button" class="restart-button" type="button">Начать заново</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
